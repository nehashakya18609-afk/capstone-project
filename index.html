<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Task Manager</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>TaskFlow</h1>
            <p>Manage your tasks easily with AI assistance</p>
        </header>


        <!-- ============================= -->
        <!-- ADD TASK FORM -->
        <!-- ============================= -->

        <section class="task-form-section">

            <h2>Add a New Task</h2>

            <form id="task-form">

                <!-- TASK TITLE -->

                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter task title"
                    >

                    <p
                        id="title-error"
                        class="error-message"
                    ></p>

                </div>


                <!-- PRIORITY -->

                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <input
                        type="text"
                        id="priority"
                        name="priority"
                        placeholder="e.g. low, medium, high"
                    >

                </div>


                <!-- DUE DATE -->

                <div class="form-group">

                    <label for="due-date">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="due-date"
                        name="due_date"
                    >

                </div>


                <!-- SUBMIT -->

                <button type="submit">
                    Add Task
                </button>

            </form>

        </section>


        <!-- ============================= -->
        <!-- TASKFLOW AI -->
        <!-- ============================= -->

        <section class="ai-section">

            <h2>🤖 TaskFlow AI</h2>

            <p>
                Ask AI for help with your tasks, priorities,
                planning, or productivity.
            </p>

            <form id="ai-form">

                <div class="form-group">

                    <label for="ai-message">
                        Ask TaskFlow AI
                    </label>

                    <textarea
                        id="ai-message"
                        name="message"
                        rows="4"
                        placeholder="Example: Help me plan my project tasks"
                    ></textarea>

                </div>

                <button type="submit" id="ai-button">
                    Ask AI
                </button>

            </form>

            <div
                id="ai-loading"
                class="ai-loading"
                hidden
            >
                AI is thinking...
            </div>

            <div
                id="ai-error"
                class="error-message"
            ></div>

            <div class="ai-response-box">

                <h3>AI Response</h3>

                <p id="ai-response">
                    Your AI response will appear here.
                </p>

            </div>

        </section>


        <!-- ============================= -->
        <!-- TASK LIST -->
        <!-- ============================= -->

        <section class="task-list-section">

            <h2>My Tasks</h2>

            <div id="task-list">
                <!-- Tasks will be rendered here -->
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
